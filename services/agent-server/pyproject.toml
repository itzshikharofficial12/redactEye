[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "redact-eye-agent-server"
version = "0.1.0"
description = "RedactEye Agent Server - FastAPI backend for sanitized context reasoning and planning"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Person 3 - Backend / Agent / Evaluation" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]